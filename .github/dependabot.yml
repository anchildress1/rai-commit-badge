version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 2
    labels:
      - ':robot: AutoSummon'
    # a freshly published version is the window a compromised release ships in;
    # this action runs in other people's runners, so let one age before taking it
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - '*'

  # @actions/core and ignore are bundled into the committed dist/ that runs in
  # every consumer's runner — the one dependency set this action actually ships.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 2
    labels:
      - ':robot: AutoSummon'
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - '*'
