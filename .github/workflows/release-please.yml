name: Release Please

# Two triggers, one file. release-please opens and lands the release PR on
# push; the floating tags move only once a draft release is actually published,
# because a draft carries no tag to point at.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  major-tag:
    name: Move the floating major and minor tags
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Retag v{major} and v{major}.{minor}
        env:
          # via env, never inlined — a tag name is attacker-controllable text
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a plain release tag; leaving the floating tags alone"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for tag in "$major" "$minor"; do
            # -f and --force: these tags already exist from the previous release
            git tag -fa "$tag" -m "Release $TAG" "$TAG"
            git push origin "refs/tags/$tag" --force
            echo "moved $tag to $TAG"
          done
