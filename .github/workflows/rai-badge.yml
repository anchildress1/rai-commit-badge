name: RAI Attribution

# Dogfoods the action against its own history. `uses: ./` runs the committed
# dist/ bundle exactly as a consumer would, so a broken build fails here before
# it reaches the Marketplace.

on:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — the score is a lifetime measure and barely moves per commit
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  score:
    name: Score and publish the badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the whole history is the input; a shallow clone hard-fails
          fetch-depth: 0

      - uses: ./
