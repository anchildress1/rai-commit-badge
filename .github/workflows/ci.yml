name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.churnignore'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'vitest.config.js'
      - 'sonar-project.properties'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.churnignore'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'vitest.config.js'
      - 'sonar-project.properties'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: reports/
          retention-days: 7

  key-parity:
    name: Footer key parity with rai-lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Compare footer keys
        run: node scripts/check-key-parity.js

  sonarcloud:
    name: SonarCloud Scan
    needs: [test]
    # SONAR_TOKEN is unavailable to forks, so the scan can only run on our own refs
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # new-code detection compares against the base branch
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage
          path: reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
