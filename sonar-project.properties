sonar.projectKey=anchildress1_rai-commit-badge
sonar.organization=anchildress1
sonar.host.url=https://sonarcloud.io
sonar.sources=src,scripts,.github
sonar.tests=tests
# dist/ is a 488KB minified ncc bundle — analysing it measures ncc, not this repo
sonar.exclusions=**/node_modules/**,dist/**
sonar.javascript.lcov.reportPaths=reports/lcov.info
# Fixture setup repeats by design; duplication findings there are noise
sonar.cpd.exclusions=tests/**

# S4036 wants an absolute path for the git binary. A runner resolves git from
# PATH, and hardcoding /usr/bin/git breaks macOS, Windows, and local test runs.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=src/git.js
