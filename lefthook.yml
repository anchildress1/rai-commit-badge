pre-commit:
  commands:
    format:
      glob: '*.{js,json,md,yml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.js'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    test:
      glob: '{src,tests}/**/*.js'
      run: npm test

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
